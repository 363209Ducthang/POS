<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Màn hình khách hàng</title>
<style>
:root{--ink:#182235;--muted:#748096;--blue:#245ee4;--blue-dark:#102a68;--line:#e3e8f0;--soft:#f5f7fb;--coral:#ef684d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:#f4f6fa}
.head{min-height:92px;background:var(--blue-dark);color:#fff;display:flex;align-items:center;padding:16px 52px;justify-content:space-between;box-shadow:0 5px 20px #102a6826}.brand{display:flex;align-items:center;gap:14px}.brand-mark{width:46px;height:46px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--blue);font-size:23px}.brand h1{margin:0;font-size:21px;letter-spacing:.4px}.brand p{margin:3px 0 0;color:#b9caf1;font-size:10px}.brand #storeLegal{font-size:9px;font-weight:700;color:#dbe5ff}.customer{font-size:12px;color:#fff;font-weight:700;background:#ffffff16;border:1px solid #ffffff38;padding:10px 14px;border-radius:8px}
.wrap{width:min(1180px,calc(100% - 104px));margin:30px auto;padding:0}.welcome{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.welcome h2{margin:0;font-size:23px;letter-spacing:-.3px}.welcome p{margin:5px 0 0;color:var(--muted);font-size:11px}.welcome-badge{padding:8px 11px;border-radius:7px;background:#fff;border:1px solid var(--line);color:var(--blue);font-size:10px;font-weight:800}
.order-board{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #17294b0a;overflow:hidden}.board-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.board-head h3{margin:0;font-size:13px}.board-head span{color:var(--muted);font-size:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 20px;border-bottom:1px solid #edf0f4;text-align:left}.table th{background:#fafbfd;color:#7b879b;font-size:9px;text-transform:uppercase;letter-spacing:.6px}.table td{font-size:12px}.table tbody tr:hover{background:#fafcff}.right{text-align:right!important}.total-bar{display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:17px 20px;background:#f7f9fd}.total-label{color:#718097;font-size:11px;font-weight:700}.total{font-size:26px;font-weight:900;color:var(--blue);text-align:right}
.empty{display:grid;place-items:center;align-content:center;min-height:calc(100vh - 92px);color:#65738b;font-size:16px;background:radial-gradient(circle at center,#fff 0,#f4f6fa 58%)}.empty:before{content:"🛒";display:grid;place-items:center;width:64px;height:64px;margin-bottom:14px;border-radius:18px;background:#e7efff;color:var(--blue);font-size:27px;box-shadow:0 8px 22px #245ee41a}
.qr-container{margin-top:16px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:19px;display:none;box-shadow:0 8px 24px #17294b0a}.qr-container .qr-label{font-weight:800;font-size:13px;color:#213b70;margin-bottom:11px}.qr-container img{max-width:190px;border:1px solid #dce3ef;border-radius:9px;padding:7px;background:#fff}.qr-container .bank-info{font-size:10px;color:#63718a;margin-top:8px}.thanks{text-align:center;color:#8591a4;font-size:10px;margin-top:18px}
@media(max-width:700px){.head{padding:12px 18px}.brand h1{font-size:16px}.brand-mark{width:36px;height:36px;font-size:18px}.customer{font-size:11px;padding:8px}.wrap{width:calc(100% - 28px);margin:18px auto}.welcome{align-items:flex-start;gap:12px}.welcome h2{font-size:21px}.welcome-badge{font-size:9px}.board-head{padding:15px}.table th,.table td{padding:12px 15px}.table th:nth-child(2),.table td:nth-child(2){display:none}.total-bar{padding:16px;gap:14px}.total{font-size:23px}}
</style>
</head>
<body>
<div class="head"><div class="brand"><div class="brand-mark">🛒</div><div><h1 id="storeName">TẠP HÓA POS</h1><p id="storeLegal"></p><p id="storeAddress">Mua sắm nhanh - Giá tốt mỗi ngày</p></div></div><div id="customer" class="customer">Khách lẻ</div></div>
<div id="content" class="wrap"><div class="empty">Mời khách hàng chọn sản phẩm</div></div>
<div id="qrContainer" class="qr-container">
    <div class="qr-label">📱 Quét mã QR để thanh toán</div>
    <img id="qrImage" alt="Mã QR" />
    <div class="bank-info" id="qrBankInfo"></div>
</div>

<script>
function money(n){return new Intl.NumberFormat("vi-VN",{style:"currency",currency:"VND",maximumFractionDigits:0}).format(Number(n)||0)}

function render(d){
    try {
        const customerEl = document.querySelector("#customer");
        if (customerEl) customerEl.textContent = d.customer || "Khách lẻ";

        const content = document.querySelector("#content");
        const store = d.store || {};
        document.getElementById("storeName").textContent = store.storeName || "TẠP HÓA POS";
        document.getElementById("storeLegal").textContent = [store.businessName ? `HKD: ${store.businessName}` : "", store.taxCode ? `MST: ${store.taxCode}` : ""].filter(Boolean).join(" · ");
        document.getElementById("storeAddress").textContent = [store.businessAddress, store.businessPhone].filter(Boolean).join(" · ") || "Mua sắm nhanh - Giá tốt mỗi ngày";
        
        if (!d.items || !Array.isArray(d.items) || !d.items.length) {
            content.innerHTML = '<div class="empty">Mời khách hàng chọn sản phẩm</div>';
            document.getElementById("qrContainer").style.display = "none";
            return;
        }

        let html = `<div class="welcome"><div><h2>Hóa đơn tạm tính</h2><p>Vui lòng kiểm tra sản phẩm và số tiền trước khi thanh toán.</p></div><div class="welcome-badge">${d.items.length} mặt hàng</div></div><div class="order-board"><div class="board-head"><h3>Chi tiết giỏ hàng</h3><span>Đơn vị tính theo sản phẩm</span></div><table class="table"><thead><tr><th>Tên hàng</th><th>Đơn vị</th><th>Số lượng</th><th class="right">Thành tiền</th></tr></thead><tbody>`;
        
        d.items.forEach(i => {
            const itemTotal = (i.qty || 0) * (i.price || 0);
            html += `<tr><td><b>${i.name ? String(i.name).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) : "Sản phẩm"}</b></td><td>${i.unit || "Cái"}</td><td>${i.qty || 0}</td><td class="right">${money(itemTotal)}</td></tr>`;
        });
        
        html += `</tbody></table><div class="total-bar"><span class="total-label">TỔNG THANH TOÁN</span><div class="total">${money(d.total || 0)}</div></div></div><div class="thanks">${store.businessSlogan || "Cảm ơn quý khách và hẹn gặp lại!"}</div>`;
        content.innerHTML = html;

        // Xử lý QR
        const qrContainer = document.getElementById("qrContainer");
        const qrImg = document.getElementById("qrImage");
        const qrInfo = document.getElementById("qrBankInfo");

        if (d.paymentMethod === "transfer" && d.qrData && d.total > 0) {
            qrContainer.style.display = "block";
            qrImg.src = d.qrData;
            qrImg.onerror = function() {
                qrImg.style.display = "none";
                qrInfo.textContent = "Không thể tải mã QR, vui lòng kiểm tra kết nối.";
            };
            qrInfo.textContent = `Chuyển khoản đến ${store.bankOwner || d.bankOwner || ''} - ${store.bankName || d.bankName || ''} - Số tiền: ${money(d.total)}`;
        } else {
            qrContainer.style.display = "none";
        }
    } catch(e) {
        console.error("Render error:", e);
        const content = document.querySelector("#content");
        if (content) content.innerHTML = '<div class="empty">Có lỗi khi hiển thị dữ liệu</div>';
    }
}

// Lấy dữ liệu từ localStorage
try {
    let d = JSON.parse(localStorage.getItem("thpos_customer_screen") || "null");
    if (d) render(d);
} catch(e) {}

// Lắng nghe sự kiện storage (từ tab khác)
window.addEventListener("storage", function(e) {
    if (e.key === "thpos_customer_screen" && e.newValue) {
        try {
            render(JSON.parse(e.newValue));
        } catch(err) {}
    }
});

// Lắng nghe message từ cửa sổ chính (nếu có)
window.addEventListener("message", function(e) {
    if (e.data && e.data.type === "pos-update" && e.data.data) {
        render(e.data.data);
    }
});

window.opener?.postMessage({type:"customer-ready"},"*");
</script>
</body>
</html>
